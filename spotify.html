<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spotify Now Playing</title>
  <style>
    :root {
      --bg: #0f0f12;
      --muted: #b3b3b3;
      --accent: #1db954;
      --bar: #1e1e24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: transparent;
      font-family: "Inter", Arial, sans-serif;
      color: white;
    }
    .widget {
      width: 420px;
      height: 110px;
      background: var(--bg);
      border-radius: 14px;
      display: flex;
      gap: 12px;
      padding: 12px;
      align-items: center;
    }
    .cover-wrap {
      position: relative;
      width: 86px;
      height: 86px;
      border-radius: 50%;
      overflow: hidden;
      background: radial-gradient(circle at center, #1a1a1f 0 10px, #101014 10px 100%);
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.06);
    }
    .cover-wrap::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #0b0b0d;
      border: 2px solid rgba(255, 255, 255, 0.25);
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      pointer-events: none;
    }
    .cover {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      object-fit: cover;
      background: #1a1a1f;
      animation: spinDisc 4s linear infinite;
      animation-play-state: paused;
      transform-origin: center;
    }
    .cover.spinning {
      animation-play-state: running;
    }
    .info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .song {
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .artist {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bar {
      height: 6px;
      background: var(--bar);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 10px;
    }
    .progress {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.2s linear;
    }
    .status {
      width: 420px;
      padding: 8px 10px;
      font-size: 13px;
      color: var(--muted);
      background: rgba(15, 15, 18, 0.7);
      border-radius: 10px;
      display: none;
    }
    .play-icon {
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 10px solid white;
      margin-left: 2px;
    }
    @keyframes spinDisc {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="widget" class="widget" style="display:none">
    <div class="cover-wrap">
      <img id="cover" class="cover" alt="" />
      <div id="pauseBadge" style="display:none;position:absolute;right:6px;bottom:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,0.65);display:flex;align-items:center;justify-content:center">
        <span class="play-icon"></span>
      </div>
    </div>
    <div class="info">
      <div id="song" class="song"></div>
      <div id="artist" class="artist"></div>
      <div class="bar">
        <div id="progress" class="progress"></div>
      </div>
    </div>
  </div>
  <div id="status" class="status"></div>

  <script>
    const DISCORD_ID = "590163355839496192";
    const widget = document.getElementById("widget");
    const statusEl = document.getElementById("status");
    const cover = document.getElementById("cover");
    const song = document.getElementById("song");
    const artist = document.getElementById("artist");
    const progress = document.getElementById("progress");
    const pauseBadge = document.getElementById("pauseBadge");
    const timeEl = document.createElement("div");
    timeEl.style.fontSize = "12px";
    timeEl.style.color = "var(--muted)";
    timeEl.style.marginTop = "6px";
    document.querySelector(".info").appendChild(timeEl);

    let currentStart = 0;
    let currentEnd = 0;
    let hasTimestamps = false;
    let lastSpotify = null;
    let lastElapsed = 0;
    let lastDuration = 0;
    let lastPercent = 0;
    let isPaused = false;

    function showStatus(text) {
      widget.style.display = "none";
      statusEl.textContent = text;
      statusEl.style.display = "block";
    }

    function showWidget() {
      statusEl.style.display = "none";
      widget.style.display = "flex";
    }

    function setPlaybackUI(paused) {
      isPaused = paused;
      pauseBadge.style.display = paused ? "flex" : "none";
      cover.classList.toggle("spinning", !paused);
    }

    function render(data) {
      if (!data) {
        showStatus("Nessun dato presenza.");
        return;
      }

      if (data.spotify) {
        lastSpotify = data.spotify;
        showWidget();
        cover.src = data.spotify.album_art_url || "";
        song.textContent = data.spotify.song || "";
        artist.textContent = data.spotify.artist || "";

        currentStart = Number(data.spotify.timestamps && data.spotify.timestamps.start) || 0;
        currentEnd = Number(data.spotify.timestamps && data.spotify.timestamps.end) || 0;
        hasTimestamps = Number.isFinite(currentStart) && Number.isFinite(currentEnd) && currentEnd > currentStart;

        if (data.listening_to_spotify) {
          setPlaybackUI(false);
          tick();
          return;
        }

        setPlaybackUI(true);
        if (hasTimestamps) {
          const now = Date.now();
          const elapsed = Math.max(0, Math.min(currentEnd - currentStart, now - currentStart));
          const duration = currentEnd - currentStart;
          lastElapsed = elapsed;
          lastDuration = duration;
          lastPercent = (elapsed / duration) * 100;
          progress.style.width = Math.max(0, Math.min(100, lastPercent)) + "%";
          timeEl.textContent = fmt(elapsed) + " / " + fmt(duration);
        } else {
          progress.style.width = "0%";
        }
        return;
      }

      if (lastSpotify) {
        showWidget();
        cover.src = lastSpotify.album_art_url || "";
        song.textContent = lastSpotify.song || "";
        artist.textContent = lastSpotify.artist || "";
        setPlaybackUI(true);
        if (lastDuration > 0) {
          progress.style.width = Math.max(0, Math.min(100, lastPercent)) + "%";
          timeEl.textContent = fmt(lastElapsed) + " / " + fmt(lastDuration);
        } else {
          progress.style.width = "0%";
        }
        return;
      }

      showStatus("Spotify non connesso.");
      setPlaybackUI(true);
    }

    function fmt(ms) {
      if (!ms || ms < 0) return "0:00";
      const total = Math.floor(ms / 1000);
      const m = Math.floor(total / 60);
      const s = total % 60;
      return m + ":" + String(s).padStart(2, "0");
    }

    function tick() {
      if (isPaused) return;
      if (!hasTimestamps) {
        progress.style.width = "0%";
        timeEl.textContent = "?:?? / ?:??";
        return;
      }
      const now = Date.now();
      const percent = ((now - currentStart) / (currentEnd - currentStart)) * 100;
      const clamped = Math.max(0, Math.min(100, percent));
      progress.style.width = clamped + "%";
      const elapsed = now - currentStart;
      const duration = currentEnd - currentStart;
      lastElapsed = elapsed;
      lastDuration = duration;
      lastPercent = clamped;
      timeEl.textContent = fmt(elapsed) + " / " + fmt(duration);
    }

    function startTicker() {
      function loop() {
        tick();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    }

    function connect() {
      showStatus("Connessione a Lanyard...");
      const ws = new WebSocket("wss://api.lanyard.rest/socket");
      let heartbeatTimer = null;

      ws.onopen = () => {
        ws.send(JSON.stringify({
          op: 2,
          d: { subscribe_to_id: DISCORD_ID }
        }));
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);

        if (msg.op === 1 && msg.d && msg.d.heartbeat_interval) {
          clearInterval(heartbeatTimer);
          heartbeatTimer = setInterval(() => {
            ws.send(JSON.stringify({ op: 3 }));
          }, msg.d.heartbeat_interval);
        }

        if (msg.op === 0 && msg.t === "INIT_STATE") {
          const data = msg.d && msg.d[DISCORD_ID];
          render(data);
        }

        if (msg.op === 0 && msg.t === "PRESENCE_UPDATE") {
          render(msg.d);
        }
      };

      ws.onerror = (err) => {
        console.error("Lanyard websocket error:", err);
        showStatus("Errore websocket Lanyard (controlla la Console).");
      };

      ws.onclose = () => {
        clearInterval(heartbeatTimer);
        showStatus("Lanyard disconnesso. Riprovo...");
        setTimeout(connect, 2000);
      };
    }

    connect();
    startTicker();
  </script>
</body>
</html>
