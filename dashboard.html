<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Bot</title>
<link rel="stylesheet" href="dash.css">
</head>
<body>

<div class="container">

    <!-- Barra bottoni schede -->
    <div class="tab-buttons">
        <button class="active" onclick="showTab('dashboard')">Dashboard</button>
        <button onclick="showTab('fetch')">Fetch</button>
        <button onclick="showTab('more')">More</button>
    </div>

    <!-- Schede principali -->
    <div id="dashboard" class="tab-content active">
        <div class="card">Online</div>
        <div class="card">Server</div>
        <div class="card">Utenti</div>
        <div class="card">Log</div>
        <div class="card">Info</div>
        <div class="card">Altro</div>
    </div>

    <div id="fetch" class="tab-content">
        <div class="card" id="fetch-box">Caricamento dati...</div>
    </div>

    <div id="more" class="tab-content">
        <div class="card">Altro contenuto</div>
        <div class="card">Opzioni aggiuntive</div>
    </div>

</div>

<script src="dash.js"></script>
</body>
</html>
