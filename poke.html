<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carte Pokémon - Paradosso Temporale</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss/dist/tailwind.min.css">
</head>
<body class="bg-gray-100 text-gray-900">
  <div class="max-w-7xl mx-auto p-4">
    <h1 class="text-3xl font-bold mb-6">Carte Pokémon - Paradosso Temporale</h1>
    
    <div class="mb-4">
      <label class="mr-2 font-medium">Filtra per nome:</label>
      <input type="text" id="filtro" class="border p-1 rounded" placeholder="Es. Surskit" />
    </div>

    <div id="carte" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
  </div>

  <script>
    const tutteLeCarte = [
      { nome: "Surskit", numero: "001", rarita: "Comune", prezzo: 0.10, immagine: "https://images.pokemontcg.io/sv4/1.png" },
      { nome: "Froslass ex", numero: "003", rarita: "Rara", prezzo: 9.90, immagine: "https://images.pokemontcg.io/sv4/3.png" },
      // Altre carte...
    ];

    function render(carte) {
      const container = document.getElementById("carte");
      container.innerHTML = "";
      carte.forEach(carta => {
        container.innerHTML += `
          <div class="bg-white p-4 rounded-xl shadow hover:shadow-lg transition">
            <img src="${carta.immagine}" alt="${carta.nome}" class="w-full h-48 object-contain mb-2" />
            <h2 class="font-semibold text-lg">#${carta.numero} ${carta.nome}</h2>
            <p class="text-sm text-gray-500">${carta.rarita}</p>
            <p class="text-green-600 font-bold mt-1">€${carta.prezzo.toFixed(2)}</p>
          </div>
        `;
      });
    }

    document.getElementById("filtro").addEventListener("input", e => {
      const val = e.target.value.toLowerCase();
      const filtrate = tutteLeCarte.filter(c => c.nome.toLowerCase().includes(val));
      render(filtrate);
    });

    render(tutteLeCarte);
  </script>
</body>
</html>
