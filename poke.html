<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Master Set Paradosso Temporale</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss/dist/tailwind.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="pokestyle.css">
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen">
  <div class="max-w-7xl mx-auto p-4 pb-16">
    <header class="mb-6">
      <h1 class="text-3xl font-bold text-center mb-2 text-blue-600">Master Set Paradosso Temporale</h1>
      <div class="flex justify-center gap-4 mb-4">
        <button onclick="aggiornaPrezzi()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded">
          <i class="fas fa-sync-alt mr-2"></i> Aggiorna Prezzi
        </button>
        <button onclick="esportaJSON()" class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded">
          <i class="fas fa-download mr-2"></i> Esporta
        </button>
      </div>
    </header>

    <!-- Sezione Filtri e Statistiche -->
    <div class="bg-white p-4 rounded-lg shadow-md mb-6 grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <input type="text" id="filtro" class="border p-2 rounded w-full" placeholder="Cerca carta...">
      </div>
      <div class="stats-grid">
        <div class="stat">
          <h3>Completamento</h3>
          <div class="completion-bar">
            <div id="completion-bar"></div>
            <span id="completion-text"></span>
          </div>
        </div>
        <div class="stat">
          <h3>Valore Totale</h3>
          <p id="total-value">€0.00</p>
        </div>
      </div>
    </div>

    <!-- Container Carte -->
    <div id="carte" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4"></div>

    <!-- Modale Modifica -->
    <div id="modal" class="modal">
      <!-- Contenuto modale -->
    </div>
  </div>

  <script src="scan.js"></script>
</body>
</html>
