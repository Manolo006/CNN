<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poke Paradosso - Firebase</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #334155;
      --text: #e2e8f0;
      --primary: #3b82f6;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 12px;
      min-height: 100vh;
      padding: 12px;
    }

    .left-column,
    .right-column {
      background: var(--panel);
      border-radius: 12px;
      padding: 12px;
    }

    h1, h2 { margin: 0 0 12px 0; }
    h1 { font-size: 20px; }
    h2 { font-size: 16px; }

    .form-grid {
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr 120px 120px auto;
      margin-bottom: 12px;
    }

    input, button {
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
    }

    input {
      background: #0b1220;
      color: var(--text);
      outline: 1px solid #475569;
    }

    button {
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-primary { background: var(--primary); }
    .btn-danger { background: var(--danger); }
    .btn-success { background: var(--success); }
    .btn-warning { background: var(--warning); }

    .status {
      font-size: 13px;
      opacity: .9;
      margin: 0 0 10px 0;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .card {
      background: var(--panel-2);
      border-radius: 10px;
      padding: 8px;
      overflow: hidden;
    }

    .card img {
      width: 100%;
      border-radius: 8px;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      margin-bottom: 6px;
    }

    .card-title { font-weight: 700; font-size: 14px; }
    .card-sub { font-size: 12px; opacity: .9; margin-top: 2px; }
    .card-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 2px;
    }
    .card-live-price {
      font-size: 12px;
      font-weight: 700;
      min-height: 16px;
      text-align: right;
      white-space: nowrap;
    }
    .card-price-edit {
      margin-top: 2px;
      font-size: 12px;
      opacity: .95;
      cursor: pointer;
      user-select: none;
      display: inline-block;
    }
    .card-price-edit:hover { color: #7dd3fc; }
    .card-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin-top: 8px;
      width: 100%;
    }
    .card-actions button {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
      line-height: 1.2;
      text-align: center;
      font-size: clamp(10px, 0.85vw, 14px);
      padding: clamp(6px, 0.7vw, 10px);
    }

    .btn-info { background: #0ea5e9; }

    .columns-control {
      background: #0b1220;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .columns-control input[type="range"] {
      width: 100%;
      margin-top: 8px;
    }

    .cart-summary {
      background: #0b1220;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 14px;
      line-height: 1.6;
    }

    .cart-list {
      display: grid;
      gap: 8px;
      margin-bottom: 10px;
      max-height: 55vh;
      overflow: auto;
    }

    .cart-item {
      background: var(--panel-2);
      border-radius: 8px;
      padding: 8px;
      font-size: 13px;
    }

    .cart-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }

    .qty-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .qty-actions button {
      flex: 1;
      padding: 6px;
      font-size: 12px;
    }

    .info-box {
      background: #0b1220;
      border-radius: 10px;
      padding: 10px;
      margin: 8px 0;
      font-size: 14px;
    }

    .delta.up { color: #34d399; }
    .delta.down { color: #f87171; }
    .delta.neutral { color: #cbd5e1; }
    .pnl-positive { color: #34d399; font-weight: 700; }
    .pnl-negative { color: #f87171; font-weight: 700; }
    .pnl-neutral { color: #cbd5e1; font-weight: 700; }

    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr 1fr; }
      .cards-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .right-column { margin-top: 0; }
      .card-actions button {
        font-size: clamp(10px, 1.8vw, 13px);
      }
    }

    @media (max-width: 600px) {
      .layout { padding: 8px; gap: 8px; }
      .left-column,
      .right-column { padding: 10px; }
      .form-grid { grid-template-columns: 1fr; }
      .form-grid input,
      .form-grid button { width: 100%; }
      .cards-grid { grid-template-columns: 1fr; gap: 8px; }
      .card { padding: 7px; }
      .card-actions button { padding: 8px; font-size: 12px; }
      .card-meta-row { gap: 6px; }
      .card-live-price { font-size: 11px; }
      .card-price-edit { font-size: 11px; }
      .cart-row { flex-wrap: wrap; }
      .cart-row strong,
      .cart-row span { word-break: break-word; }
      .qty-actions { flex-wrap: wrap; }
      .qty-actions button { min-width: 80px; }
      .columns-control,
      .cart-summary,
      .info-box { font-size: 13px; }
    }

    @media (max-width: 380px) {
      h1 { font-size: 18px; }
      h2 { font-size: 15px; }
      .card-title { font-size: 13px; }
      .card-sub,
      .card-live-price,
      .card-price-edit { font-size: 11px; }
      .card-actions { grid-template-columns: 1fr; }
      .card-actions button {
        font-size: 11px;
        padding: 7px;
      }
      .qty-actions button { flex: 1 1 100%; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <section class="left-column">
      <h1>Carte Pokémon (Firebase)</h1>

      <form id="cardForm" class="form-grid">
        <input id="name" type="text" placeholder="Nome carta" required>
        <input id="number" type="text" placeholder="Numero" required>
        <input id="price" type="number" step="0.01" min="0" placeholder="Prezzo" required>
        <button type="submit" class="btn-primary">Aggiungi</button>
      </form>

      <div class="columns-control">
        Colonne griglia: <strong><span id="colsValue">4</span></strong>
        <input id="colsSlider" type="range" min="1" max="10" value="4">
      </div>

      <p class="status" id="status">Caricamento dati...</p>
      <div id="cardsGrid" class="cards-grid"></div>
    </section>

    <aside class="right-column">
      <h2>Analisi Prezzo</h2>
      <div id="priceInsight" class="info-box">Clicca sulla foto di una carta per vedere confronto prezzo registrato vs Cardmarket.</div>
      <a id="priceInsightLink" href="#" target="_blank" rel="noopener noreferrer" style="display:none; color:#7dd3fc; margin-bottom:12px;">Apri pagina Cardmarket</a>

      <h2>Carrello</h2>
      <div class="cart-summary">
        <div>Articoli: <strong id="cartItems">0</strong></div>
        <div>Totale: <strong>€ <span id="cartTotal">0.00</span></strong></div>
      </div>

      <div id="cartPnlSummary" class="info-box">P/L carrello: in attesa dati...</div>

      <div id="cartList" class="cart-list"></div>

      <button id="clearCartBtn" class="btn-warning" style="width:100%;">Svuota carrello</button>
    </aside>
  </div>

  <script>
    const FIREBASE_DB_URL = "https://pokeparadosso-default-rtdb.europe-west1.firebasedatabase.app";
    const CART_PATH = "/cart.json";
    const DEFAULT_SET_PTCGO = "PAR";
    const DEFAULT_SET_ID = "sv4";
    const MARKET_CACHE_TTL_MS = 5 * 60 * 1000;

    let cards = [];
    let cart = [];
    let pnlComputeToken = 0;
    let cardsPriceComputeToken = 0;
    const marketPriceCacheByKey = new Map();
    let cartItemPnlElements = new Map();

    const cardsGrid = document.getElementById("cardsGrid");
    const cartList = document.getElementById("cartList");
    const cartItemsEl = document.getElementById("cartItems");
    const cartTotalEl = document.getElementById("cartTotal");
    const cartPnlSummaryEl = document.getElementById("cartPnlSummary");
    const statusEl = document.getElementById("status");
    const priceInsightEl = document.getElementById("priceInsight");
    const priceInsightLinkEl = document.getElementById("priceInsightLink");
    const colsSliderEl = document.getElementById("colsSlider");
    const colsValueEl = document.getElementById("colsValue");

    document.getElementById("cardForm").addEventListener("submit", onSubmitCard);
    document.getElementById("clearCartBtn").addEventListener("click", clearCart);
    colsSliderEl.addEventListener("input", applyColumnsFromSlider);

    init();

    function init() {
      applyColumnsFromSlider();
      fetchCards();
      fetchCart();
      // refresh automatico ogni 8 secondi (simile realtime)
      setInterval(() => {
        fetchCards();
        fetchCart();
      }, 8000);
    }

    function applyColumnsFromSlider() {
      const cols = Math.max(1, Math.min(10, Number(colsSliderEl.value) || 4));
      colsValueEl.textContent = String(cols);
      cardsGrid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
    }

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.style.color = isError ? "#fca5a5" : "#cbd5e1";
    }

    async function fetchCart() {
      try {
        const data = await firebaseRequest(`${CART_PATH}?t=${Date.now()}`, { cache: "no-store" });

        if (!data) {
          cart = [];
          renderCart();
          return;
        }

        cart = Object.values(data)
          .map(item => ({
            id: item.id,
            name: item.name,
            number: item.number || "",
            price: Number(item.price) || 0,
            qty: Math.max(1, Number(item.qty) || 1)
          }))
          .filter(item => item.id && item.name);

        renderCart();
      } catch (err) {
        console.error("Errore caricamento carrello Firebase:", err);
      }
    }

    async function saveCartToFirebase() {
      const payload = {};
      for (const item of cart) {
        payload[item.id] = {
          id: item.id,
          name: item.name,
          number: item.number || "",
          price: Number(item.price) || 0,
          qty: Math.max(1, Number(item.qty) || 1)
        };
      }

      await firebaseRequest(CART_PATH, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
    }

    async function firebaseRequest(path, options = {}) {
      const url = `${FIREBASE_DB_URL}${path}`;
      const response = await fetch(url, options);

      if (!response.ok) {
        const body = await response.text();
        throw new Error(`HTTP ${response.status} ${response.statusText} - ${body || "nessun dettaglio"}`);
      }

      if (response.status === 204) return null;
      return response.json();
    }

    async function fetchCards() {
      setStatus("Carico carte da Firebase...");

      try {
        const data = await firebaseRequest(`/cards.json?t=${Date.now()}`, { cache: "no-store" });

        cards = data
          ? Object.entries(data).map(([id, value]) => ({
              id,
              name: value.name || "Senza nome",
              number: value.number || "000",
              price: Number(value.price) || 0,
              marketCurrentPrice: Number(value?.market?.currentPrice),
              marketSourceLabel: String(value?.market?.sourceLabel || ""),
              marketAvg30: Number(value?.market?.avg30),
              marketTrendPrice: Number(value?.market?.trendPrice),
              marketUrl: String(value?.market?.cardmarketUrl || ""),
              marketUpdatedAt: Number(value?.market?.updatedAt)
            }))
          : [];

        cards.sort((a, b) => Number(a.number) - Number(b.number));
        renderCards();
        setStatus(`Carte caricate: ${cards.length}`);
      } catch (err) {
        console.error(err);
        setStatus(`Errore Firebase: ${err.message}`, true);
      }
    }

    async function onSubmitCard(event) {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const number = document.getElementById("number").value.trim();
      const price = Number(document.getElementById("price").value);

      if (!name || !number || !Number.isFinite(price) || price < 0) {
        setStatus("Inserisci dati validi per la carta.", true);
        return;
      }

      setStatus("Salvataggio carta su Firebase...");

      try {
        await firebaseRequest(`/cards.json`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, number, price })
        });

        event.target.reset();
        await fetchCards();
        setStatus("Carta aggiunta con successo.");
      } catch (err) {
        console.error(err);
        setStatus(`Salvataggio fallito: ${err.message}`, true);
      }
    }

    async function deleteCard(cardId) {
      const ok = confirm("Eliminare questa carta?");
      if (!ok) return;

      setStatus("Eliminazione carta...");

      try {
        await firebaseRequest(`/cards/${cardId}.json`, { method: "DELETE" });

        // rimuove anche dal carrello eventuali riferimenti
        cart = cart.filter(item => item.id !== cardId);
        await saveCartToFirebase();
        renderCart();

        await fetchCards();
        setStatus("Carta eliminata.");
      } catch (err) {
        console.error(err);
        setStatus(`Eliminazione fallita: ${err.message}`, true);
      }
    }

    async function updateCardPrice(cardId) {
      const card = cards.find(c => c.id === cardId);
      if (!card) return;

      const input = prompt(`Nuovo prezzo registrato per ${card.name} #${card.number}`, card.price.toFixed(2));
      if (input === null) return;

      const normalized = String(input).replace(",", ".").trim();
      const newPrice = Number(normalized);

      if (!Number.isFinite(newPrice) || newPrice < 0) {
        setStatus("Prezzo non valido. Inserisci un numero >= 0.", true);
        return;
      }

      setStatus("Aggiorno prezzo registrato...");

      try {
        await firebaseRequest(`/cards/${cardId}.json`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ price: newPrice })
        });

        const local = cards.find(c => c.id === cardId);
        if (local) local.price = newPrice;

        renderCards();
        setStatus("Prezzo registrato aggiornato.");
      } catch (err) {
        console.error(err);
        setStatus(`Aggiornamento prezzo fallito: ${err.message}`, true);
      }
    }

    async function saveCardMarketData(cardId, marketData) {
      await firebaseRequest(`/cards/${cardId}.json`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          market: {
            currentPrice: Number(marketData.currentPrice) || null,
            sourceLabel: String(marketData.sourceLabel || ""),
            avg30: Number.isFinite(Number(marketData.avg30)) ? Number(marketData.avg30) : null,
            trendPrice: Number.isFinite(Number(marketData.trendPrice)) ? Number(marketData.trendPrice) : null,
            cardmarketUrl: String(marketData.cardmarketUrl || ""),
            updatedAt: Date.now()
          }
        })
      });
    }

    function getCardImage(number) {
      return `https://dz3we2x72f7ol.cloudfront.net/expansions/paradox-rift/it-it/SV04_IT_${number}-2x.png`;
    }

    function normalizeNumber(rawNumber) {
      const cleaned = String(rawNumber ?? "")
        .replace(/#/g, " ")
        .replace(/\s+/g, " ")
        .trim();

      // prende l'ultima parte utile (es: "PAR 210" -> "210")
      const pieces = cleaned.split(" ");
      const candidate = pieces[pieces.length - 1] || cleaned;
      return candidate.toUpperCase();
    }

    async function fetchPokemonTcgCardsByQuery(query) {
      const url = `https://api.pokemontcg.io/v2/cards?q=${encodeURIComponent(query)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`API prezzo non disponibile (${res.status})`);
      const payload = await res.json();
      return Array.isArray(payload?.data) ? payload.data : [];
    }

    function pickBestCardMatch(cardsList, cardName, cardNumber) {
      const num = String(cardNumber).toUpperCase();
      const nameNorm = String(cardName || "").trim().toLowerCase();

      let best = null;
      let bestScore = -1;

      for (const c of cardsList) {
        let score = 0;
        const cNum = String(c?.number || "").toUpperCase();
        const cName = String(c?.name || "").trim().toLowerCase();
        const cSetCode = String(c?.set?.ptcgoCode || "").toUpperCase();
        const cSetId = String(c?.set?.id || "").toLowerCase();

        if (cNum === num) score += 5;
        if (cSetCode === DEFAULT_SET_PTCGO) score += 4;
        if (cSetId === DEFAULT_SET_ID) score += 4;
        if (nameNorm && cName === nameNorm) score += 3;
        if (nameNorm && cName.includes(nameNorm)) score += 1;

        if (score > bestScore) {
          bestScore = score;
          best = c;
        }
      }

      return best || cardsList[0] || null;
    }

    async function fetchCardmarketData(card) {
      const normalizedNumber = normalizeNumber(card.number);

      // Strategia robusta: prima set+numero (evita mismatch nomi ITA/ENG), poi fallback su nome
      const queries = [
        `set.ptcgoCode:${DEFAULT_SET_PTCGO} number:${normalizedNumber}`,
        `set.id:${DEFAULT_SET_ID} number:${normalizedNumber}`,
        `number:${normalizedNumber} name:"${card.name}"`,
        `name:"${card.name}"`
      ];

      let list = [];
      for (const q of queries) {
        try {
          const result = await fetchPokemonTcgCardsByQuery(q);
          if (result.length) {
            list = result;
            break;
          }
        } catch {
          // continua sui fallback
        }
      }

      if (!list.length) throw new Error("Carta non trovata su Cardmarket/PokéTCG API (prova con numero/set corretti)");

      const match = pickBestCardMatch(list, card.name, normalizedNumber);
      if (!match) throw new Error("Carta trovata ma non selezionabile");

      const cm = match?.cardmarket || {};
      const prices = cm?.prices || {};

      // "oggi" -> preferiamo trendPrice, poi averageSellPrice, mentre avg30 lo mostriamo come extra
      const trendPrice = Number(prices.trendPrice);
      const averageSellPrice = Number(prices.averageSellPrice);
      const avg30 = Number(prices.avg30);

      let currentPrice = null;
      let sourceLabel = "Prezzo medio oggi";

      if (Number.isFinite(trendPrice) && trendPrice > 0) {
        currentPrice = trendPrice;
        sourceLabel = "Prezzo medio oggi (Trend)";
      } else if (Number.isFinite(averageSellPrice) && averageSellPrice > 0) {
        currentPrice = averageSellPrice;
        sourceLabel = "Prezzo medio oggi (Average sell)";
      } else if (Number.isFinite(avg30) && avg30 > 0) {
        currentPrice = avg30;
        sourceLabel = "Media 30 giorni (fallback)";
      }

      if (!Number.isFinite(currentPrice)) {
        throw new Error("Prezzo Cardmarket non disponibile per questa carta");
      }

      return {
        currentPrice,
        sourceLabel,
        avg30: Number.isFinite(avg30) && avg30 > 0 ? avg30 : null,
        trendPrice: Number.isFinite(trendPrice) && trendPrice > 0 ? trendPrice : null,
        cardmarketUrl: cm?.url || `https://www.cardmarket.com/it/Pokemon/Products/Search?searchString=${encodeURIComponent(card.name)}`
      };
    }

    function renderDelta(savedPrice, marketPrice) {
      const diff = marketPrice - savedPrice;
      const abs = Math.abs(diff).toFixed(2);

      if (diff > 0) {
        return {
          klass: "up",
          icon: "▲",
          text: `+€ ${abs} (Conviene: prezzo attuale più alto del tuo prezzo registrato)`
        };
      }
      if (diff < 0) {
        return {
          klass: "down",
          icon: "▼",
          text: `-€ ${abs} (Non conviene: prezzo attuale più basso del tuo prezzo registrato)`
        };
      }
      return {
        klass: "neutral",
        icon: "■",
        text: "€ 0.00 (Parità)"
      };
    }

    function renderCardDeltaBadge(savedPrice, marketPrice) {
      const diff = marketPrice - savedPrice;
      const abs = Math.abs(diff).toFixed(2);

      if (diff > 0) {
        return {
          klass: "pnl-positive",
          text: `▲ +€ ${abs}`
        };
      }

      if (diff < 0) {
        return {
          klass: "pnl-negative",
          text: `▼ -€ ${abs}`
        };
      }

      return {
        klass: "pnl-neutral",
        text: "■ € 0.00"
      };
    }

    async function showPriceInsight(cardId) {
      const card = cards.find(c => c.id === cardId);
      if (!card) return;

      priceInsightLinkEl.style.display = "none";
      priceInsightEl.innerHTML = `
        <div><strong>${card.name} #${card.number}</strong></div>
        <div style="margin-top:8px;">Prezzo registrato: <strong>€ ${card.price.toFixed(2)}</strong></div>
        <div style="margin-top:8px;">Carico prezzo attuale da Cardmarket...</div>
      `;

      try {
        const market = await fetchCardmarketData(card);
        const delta = renderDelta(card.price, market.currentPrice);

        const extraLines = [];
        if (market.trendPrice !== null) {
          extraLines.push(`<div style="margin-top:6px;">Trend: <strong>€ ${market.trendPrice.toFixed(2)}</strong></div>`);
        }
        if (market.avg30 !== null) {
          extraLines.push(`<div style="margin-top:6px;">Media 30 giorni: <strong>€ ${market.avg30.toFixed(2)}</strong></div>`);
        }

        priceInsightEl.innerHTML = `
          <div><strong>${card.name} #${card.number}</strong></div>
          <div style="margin-top:8px;">Prezzo registrato: <strong>€ ${card.price.toFixed(2)}</strong></div>
          <div style="margin-top:8px;">${market.sourceLabel}: <strong>€ ${market.currentPrice.toFixed(2)}</strong></div>
          ${extraLines.join("")}
          <div class="delta ${delta.klass}" style="margin-top:10px; font-weight:700;">
            ${delta.icon} ${delta.text}
          </div>
        `;

        priceInsightLinkEl.href = market.cardmarketUrl;
        priceInsightLinkEl.style.display = "inline-block";
      } catch (err) {
        priceInsightEl.innerHTML = `
          <div><strong>${card.name} #${card.number}</strong></div>
          <div style="margin-top:8px;">Prezzo registrato: <strong>€ ${card.price.toFixed(2)}</strong></div>
          <div style="margin-top:8px; color:#fca5a5;">${err.message}</div>
        `;
      }
    }

    function renderCards() {
      cardsGrid.innerHTML = "";

      if (!cards.length) {
        cardsGrid.innerHTML = "<p>Nessuna carta disponibile.</p>";
        return;
      }

      for (const card of cards) {
        const hasSavedMarket = Number.isFinite(card.marketCurrentPrice) && card.marketCurrentPrice > 0;
        const savedDelta = hasSavedMarket ? renderCardDeltaBadge(card.price, card.marketCurrentPrice) : null;
        const savedMarketClass = savedDelta ? savedDelta.klass : "pnl-neutral";
        const savedMarketText = savedDelta ? savedDelta.text : "...";

        const article = document.createElement("article");
        article.className = "card";

        article.innerHTML = `
          <img src="${getCardImage(card.number)}" alt="${card.name}" loading="lazy" data-action="price" data-id="${card.id}" style="cursor:pointer;">
          <div class="card-title">${card.name}</div>
          <div class="card-meta-row">
            <div class="card-sub">#${card.number}</div>
            <div class="card-live-price ${savedMarketClass}" data-live-price="${card.id}">${savedMarketText}</div>
          </div>
          <div class="card-price-edit" data-action="edit-price" data-id="${card.id}" title="Clicca per modificare il prezzo registrato">€ ${card.price.toFixed(2)} ✎</div>
          <div class="card-actions">
            <button class="btn-success" data-action="add" data-id="${card.id}">+ Carrello</button>
            <button class="btn-danger" data-action="delete" data-id="${card.id}">Elimina</button>
          </div>
        `;

        cardsGrid.appendChild(article);
      }

      cardsGrid.querySelectorAll("button[data-action='add']").forEach(btn => {
        btn.addEventListener("click", () => addToCart(btn.dataset.id));
      });

      cardsGrid.querySelectorAll("button[data-action='delete']").forEach(btn => {
        btn.addEventListener("click", () => deleteCard(btn.dataset.id));
      });

      cardsGrid.querySelectorAll("img[data-action='price']").forEach(img => {
        img.addEventListener("click", () => showPriceInsight(img.dataset.id));
      });

      cardsGrid.querySelectorAll("[data-action='edit-price']").forEach(el => {
        el.addEventListener("click", () => updateCardPrice(el.dataset.id));
      });

      updateCardsMarketPriceBadges();
    }

    async function getMarketDataForDisplayCard(card) {
      const number = card.number || "";
      const cacheKey = `${card.id}|${card.name}|${number}`;
      const now = Date.now();

      const cached = marketPriceCacheByKey.get(cacheKey);
      if (cached && now - cached.ts < MARKET_CACHE_TTL_MS) {
        return { data: cached.data, fromCache: true };
      }

      const data = await fetchCardmarketData({
        name: card.name,
        number
      });

      marketPriceCacheByKey.set(cacheKey, { ts: now, data });
      return { data, fromCache: false };
    }

    async function updateCardsMarketPriceBadges() {
      const token = ++cardsPriceComputeToken;

      for (const card of cards) {
        const badgeEl = cardsGrid.querySelector(`[data-live-price="${card.id}"]`);
        if (!badgeEl) continue;

        try {
          const marketResult = await getMarketDataForDisplayCard(card);
          if (token !== cardsPriceComputeToken) return;

          const market = marketResult.data;
          const liveDelta = renderCardDeltaBadge(card.price, market.currentPrice);
          badgeEl.className = `card-live-price ${liveDelta.klass}`;
          badgeEl.textContent = liveDelta.text;

          const savedPrice = Number(card.marketCurrentPrice);
          const hasMeaningfulChange = !Number.isFinite(savedPrice) || Math.abs(savedPrice - market.currentPrice) >= 0.01;
          if (!marketResult.fromCache && hasMeaningfulChange) {
            saveCardMarketData(card.id, market).catch(err => {
              console.error("Errore salvataggio prezzo medio Firebase:", err);
            });
          }
        } catch {
          if (token !== cardsPriceComputeToken) return;
          badgeEl.className = "card-live-price pnl-neutral";
          badgeEl.textContent = "n.d.";
        }
      }
    }

    function addToCart(cardId) {
      const card = cards.find(c => c.id === cardId);
      if (!card) return;

      const existing = cart.find(item => item.id === card.id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({
          id: card.id,
          name: card.name,
          number: card.number || "",
          price: card.price,
          qty: 1
        });
      }

      saveCartToFirebase().catch(err => {
        console.error(err);
        setStatus(`Errore salvataggio carrello: ${err.message}`, true);
      });
      renderCart();
    }

    function changeQty(cardId, delta) {
      const item = cart.find(c => c.id === cardId);
      if (!item) return;

      item.qty += delta;
      if (item.qty <= 0) {
        cart = cart.filter(c => c.id !== cardId);
      }

      saveCartToFirebase().catch(err => {
        console.error(err);
        setStatus(`Errore salvataggio carrello: ${err.message}`, true);
      });
      renderCart();
    }

    function clearCart() {
      if (!cart.length) return;
      if (!confirm("Svuotare tutto il carrello?")) return;

      cart = [];
      saveCartToFirebase().catch(err => {
        console.error(err);
        setStatus(`Errore salvataggio carrello: ${err.message}`, true);
      });
      renderCart();
    }

    function renderCart() {
      cartList.innerHTML = "";
      cartItemPnlElements = new Map();

      let itemsCount = 0;
      let total = 0;

      if (!cart.length) {
        cartList.innerHTML = "<p>Carrello vuoto.</p>";
      } else {
        for (const item of cart) {
          const subtotal = item.price * item.qty;
          itemsCount += item.qty;
          total += subtotal;

          const div = document.createElement("div");
          div.className = "cart-item";
          div.innerHTML = `
            <div class="cart-row">
              <strong>${item.name}</strong>
              <span>€ ${subtotal.toFixed(2)}</span>
            </div>
            <div class="cart-row" style="margin-top:4px; opacity:.9;">
              <span>€ ${item.price.toFixed(2)} x ${item.qty}</span>
            </div>
            <div class="cart-row" style="margin-top:4px; opacity:.95;">
              <span class="item-pnl">P/L: calcolo...</span>
            </div>
            <div class="qty-actions">
              <button class="btn-warning" data-qty="-1" data-id="${item.id}">-1</button>
              <button class="btn-success" data-qty="1" data-id="${item.id}">+1</button>
              <button class="btn-danger" data-qty="remove" data-id="${item.id}">Rimuovi</button>
            </div>
          `;

          const itemPnlEl = div.querySelector(".item-pnl");
          if (itemPnlEl) {
            cartItemPnlElements.set(item.id, itemPnlEl);
          }

          cartList.appendChild(div);
        }

        cartList.querySelectorAll("button[data-qty]").forEach(btn => {
          btn.addEventListener("click", () => {
            const id = btn.dataset.id;
            const action = btn.dataset.qty;
            if (action === "remove") {
              cart = cart.filter(c => c.id !== id);
              saveCartToFirebase().catch(err => {
                console.error(err);
                setStatus(`Errore salvataggio carrello: ${err.message}`, true);
              });
              renderCart();
              return;
            }

            changeQty(id, Number(action));
          });
        });
      }

      cartItemsEl.textContent = String(itemsCount);
      cartTotalEl.textContent = total.toFixed(2);

      updateCartProfitLossUI();
    }

    function resolveCartItemNumber(item) {
      if (item.number) return item.number;
      const linkedCard = cards.find(c => c.id === item.id);
      return linkedCard?.number || "";
    }

    async function getMarketDataForCartItem(item) {
      const number = resolveCartItemNumber(item);
      const cacheKey = `${item.id}|${item.name}|${number}`;
      const now = Date.now();

      const cached = marketPriceCacheByKey.get(cacheKey);
      if (cached && now - cached.ts < MARKET_CACHE_TTL_MS) {
        return cached.data;
      }

      const data = await fetchCardmarketData({
        name: item.name,
        number
      });

      marketPriceCacheByKey.set(cacheKey, { ts: now, data });
      return data;
    }

    function formatSignedEuro(value) {
      const abs = Math.abs(value).toFixed(2);
      return `${value >= 0 ? "+" : "-"}€ ${abs}`;
    }

    async function updateCartProfitLossUI() {
      const token = ++pnlComputeToken;

      if (!cart.length) {
        cartPnlSummaryEl.innerHTML = `
          <div><strong>Profit/Loss carrello</strong></div>
          <div style="margin-top:6px;">Carrello vuoto.</div>
        `;
        return;
      }

      let buyKnownTotal = 0;
      let marketKnownTotal = 0;
      let missingCount = 0;

      for (const item of cart) {
        const buySubtotal = item.price * item.qty;
        const itemPnlEl = cartItemPnlElements.get(item.id);

        try {
          const market = await getMarketDataForCartItem(item);
          if (token !== pnlComputeToken) return;

          const marketSubtotal = market.currentPrice * item.qty;
          const delta = marketSubtotal - buySubtotal;

          buyKnownTotal += buySubtotal;
          marketKnownTotal += marketSubtotal;

          if (itemPnlEl) {
            const klass = delta > 0 ? "pnl-positive" : delta < 0 ? "pnl-negative" : "pnl-neutral";
            itemPnlEl.className = `item-pnl ${klass}`;
            itemPnlEl.textContent = `P/L: ${formatSignedEuro(delta)}`;
          }
        } catch {
          if (token !== pnlComputeToken) return;
          missingCount += 1;
          if (itemPnlEl) {
            itemPnlEl.className = "item-pnl pnl-neutral";
            itemPnlEl.textContent = "P/L: n.d. (prezzo non trovato)";
          }
        }
      }

      if (token !== pnlComputeToken) return;

      const pnlTotal = marketKnownTotal - buyKnownTotal;
      const pnlClass = pnlTotal > 0 ? "pnl-positive" : pnlTotal < 0 ? "pnl-negative" : "pnl-neutral";

      const budgetLine = pnlTotal >= 0
        ? `<div class="pnl-positive" style="margin-top:8px;">Budget disponibile: +€ ${pnlTotal.toFixed(2)}</div>`
        : `<div class="pnl-negative" style="margin-top:8px;">Budget mancante: -€ ${Math.abs(pnlTotal).toFixed(2)}</div>`;

      cartPnlSummaryEl.innerHTML = `
        <div><strong>Profit/Loss carrello</strong></div>
        <div style="margin-top:6px;">Costo registrato (carte con prezzo trovato): <strong>€ ${buyKnownTotal.toFixed(2)}</strong></div>
        <div style="margin-top:4px;">Valore oggi Cardmarket: <strong>€ ${marketKnownTotal.toFixed(2)}</strong></div>
        <div class="${pnlClass}" style="margin-top:6px;">P/L totale: ${formatSignedEuro(pnlTotal)}</div>
        ${budgetLine}
        ${missingCount > 0 ? `<div style="margin-top:8px; opacity:.85;">Carte senza prezzo trovato: ${missingCount}</div>` : ""}
      `;
    }
  </script>
</body>
</html>
