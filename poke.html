<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carte Pokémon - Paradosso Temporale</title>
  <!-- Link a TailwindCSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss/dist/tailwind.min.css">
  <!-- Link al CSS personalizzato (pokestyle.css) -->
  <link rel="stylesheet" href="pokestyle.css">
  <script src="scan.js" defer></script>
</head>
<body class="bg-gray-100 text-gray-900">
  <div class="max-w-7xl mx-auto p-4">
    <h1 class="text-3xl font-bold mb-6">Carte Pokémon - Paradosso Temporale</h1>

    <!-- Sezione Filtro e scansione unificata -->
    <div class="mb-4">
      <label class="mr-2 font-medium">Cerca o scansiona il codice della carta:</label>
      <input type="text" id="filtro" class="border p-2 rounded w-full" placeholder="Es. Surskit, 1234 o codice della carta" />
    </div>
    
    <!-- Sezione per mostrare la carta in sovrimpressione -->
    <div id="card-preview" style="display:none; position: absolute; background-color: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); z-index: 10;">
      <img id="preview-img" src="" alt="" style="width: 100px; height: 140px; object-fit: contain; margin-bottom: 10px;" />
      <h3 id="preview-name" class="font-bold"></h3>
      <p id="preview-number"></p>
      <p id="preview-rarity"></p>
      <p id="preview-quantity"></p>
    </div>
    
    <!-- Barra di completamento -->
    <div class="mb-4">
      <label class="font-medium">Completamento collezione:</label>
      <div class="w-full bg-gray-300 rounded-full h-2 mb-2">
        <div id="completion-bar" class="bg-green-500 h-2 rounded-full" style="width: 0%;"></div>
      </div>
      <p id="completion-text" class="text-sm text-gray-600">0% completato</p>
    </div>

    <!-- Valore collezione e totale speso -->
    <div class="mb-4">
      <p id="total-value" class="text-lg font-semibold">Valore della collezione: €0.00</p>
      <p id="total-spent" class="text-lg font-semibold">Totale speso: €0.00</p>
    </div>

    <!-- Container per le carte -->
    <div id="carte" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>

    <!-- Modale per la modifica -->
    <div id="modal" style="display:none;" class="fixed inset-0 bg-gray-800 bg-opacity-50 flex justify-center items-center">
      <div class="bg-white p-4 rounded-xl shadow-lg">
        <h2 class="text-xl font-semibold mb-4">Modifica Carta</h2>
        <img id="modal-img" src="" alt="Carta" class="w-32 mb-4" />
        <label>Nome:</label>
        <input type="text" id="modal-nome" class="border p-2 mb-4" />
        <label>Numero:</label>
        <input type="text" id="modal-numero" class="border p-2 mb-4" />
        <label>Rarità:</label>
        <input type="text" id="modal-rarita" class="border p-2 mb-4" />
        <label>Quantità:</label>
        <input type="number" id="modal-quantita" class="border p-2 mb-4" min="0" />
        <button onclick="salvaModifiche()" class="bg-blue-500 text-white p-2 rounded">Salva</button>
        <button onclick="chiudiModal()" class="bg-red-500 text-white p-2 rounded">Chiudi</button>
      </div>
    </div>
  </div>
</body>
</html>
