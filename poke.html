<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carte Pokémon - Paradosso Temporale</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss/dist/tailwind.min.css">
  <script src="scan.js" defer></script>
</head>
<body class="bg-gray-100 text-gray-900">
  <div class="max-w-7xl mx-auto p-4">
    <h1 class="text-3xl font-bold mb-6">Carte Pokémon - Paradosso Temporale</h1>

    <!-- Sezione Filtro -->
    <div class="mb-4">
      <label class="mr-2 font-medium">Filtra per nome:</label>
      <input type="text" id="filtro" class="border p-1 rounded" placeholder="Es. Surskit" />
    </div>

    <!-- Container per le carte -->
    <div id="carte" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    
    <!-- Input per la scansione -->
    <input id="scannerInput" type="text" placeholder="Scansiona il codice della carta" class="p-2 border rounded mb-4" />

    <!-- Modale per la modifica -->
    <div id="modal" style="display:none;" class="fixed inset-0 bg-gray-800 bg-opacity-50 flex justify-center items-center">
      <div class="bg-white p-4 rounded-xl shadow-lg">
        <h2 class="text-xl font-semibold mb-4">Modifica Carta</h2>
        <img id="modal-img" src="" alt="Carta" class="w-32 mb-4" />
        <label>Nome:</label>
        <input type="text" id="modal-nome" class="border p-2 mb-4" />
        <label>Numero:</label>
        <input type="text" id="modal-numero" class="border p-2 mb-4" />
        <label>Rarità:</label>
        <input type="text" id="modal-rarita" class="border p-2 mb-4" />
        <button onclick="salvaModifiche()" class="bg-blue-500 text-white p-2 rounded">Salva</button>
        <button onclick="chiudiModal()" class="bg-red-500 text-white p-2 rounded">Chiudi</button>
      </div>
    </div>
  </div>
</body>
</html>
