<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poke Paradosso - Firebase</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #334155;
      --text: #e2e8f0;
      --primary: #3b82f6;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 12px;
      min-height: 100vh;
      padding: 12px;
    }

    .left-column,
    .right-column {
      background: var(--panel);
      border-radius: 12px;
      padding: 12px;
    }

    h1, h2 { margin: 0 0 12px 0; }
    h1 { font-size: 20px; }
    h2 { font-size: 16px; }

    .form-grid {
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr 120px 120px auto;
      margin-bottom: 12px;
    }

    input, button {
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
    }

    input {
      background: #0b1220;
      color: var(--text);
      outline: 1px solid #475569;
    }

    button {
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-primary { background: var(--primary); }
    .btn-danger { background: var(--danger); }
    .btn-success { background: var(--success); }
    .btn-warning { background: var(--warning); }

    .status {
      font-size: 13px;
      opacity: .9;
      margin: 0 0 10px 0;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 10px;
    }

    .card {
      background: var(--panel-2);
      border-radius: 10px;
      padding: 8px;
    }

    .card img {
      width: 100%;
      border-radius: 8px;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      margin-bottom: 6px;
    }

    .card-title { font-weight: 700; font-size: 14px; }
    .card-sub { font-size: 12px; opacity: .9; margin-top: 2px; }
    .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }

    .btn-info { background: #0ea5e9; }

    .cart-summary {
      background: #0b1220;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 14px;
      line-height: 1.6;
    }

    .cart-list {
      display: grid;
      gap: 8px;
      margin-bottom: 10px;
      max-height: 55vh;
      overflow: auto;
    }

    .cart-item {
      background: var(--panel-2);
      border-radius: 8px;
      padding: 8px;
      font-size: 13px;
    }

    .cart-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }

    .qty-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .qty-actions button {
      flex: 1;
      padding: 6px;
      font-size: 12px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 20;
    }

    .modal.open { display: flex; }

    .modal-content {
      width: min(560px, 100%);
      background: var(--panel);
      border-radius: 12px;
      padding: 14px;
      border: 1px solid #475569;
    }

    .modal-title {
      margin: 0 0 10px 0;
      font-size: 18px;
    }

    .info-box {
      background: #0b1220;
      border-radius: 10px;
      padding: 10px;
      margin: 8px 0;
      font-size: 14px;
    }

    .delta.up { color: #34d399; }
    .delta.down { color: #f87171; }
    .delta.neutral { color: #cbd5e1; }

    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <section class="left-column">
      <h1>Carte Pokémon (Firebase)</h1>

      <form id="cardForm" class="form-grid">
        <input id="name" type="text" placeholder="Nome carta" required>
        <input id="number" type="text" placeholder="Numero" required>
        <input id="price" type="number" step="0.01" min="0" placeholder="Prezzo" required>
        <button type="submit" class="btn-primary">Aggiungi</button>
      </form>

      <p class="status" id="status">Caricamento dati...</p>
      <div id="cardsGrid" class="cards-grid"></div>
    </section>

    <aside class="right-column">
      <h2>Carrello</h2>
      <div class="cart-summary">
        <div>Articoli: <strong id="cartItems">0</strong></div>
        <div>Totale: <strong>€ <span id="cartTotal">0.00</span></strong></div>
      </div>

      <div id="cartList" class="cart-list"></div>

      <button id="clearCartBtn" class="btn-warning" style="width:100%;">Svuota carrello</button>
    </aside>
  </div>

  <div id="detailsModal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <h3 id="detailsTitle" class="modal-title">Dettagli carta</h3>
      <div id="detailsBody" class="info-box">Caricamento...</div>
      <button id="closeDetailsBtn" class="btn-primary" style="width:100%; margin-top:10px;">Chiudi</button>
    </div>
  </div>

  <script>
    const FIREBASE_DB_URL = "https://pokeparadosso-default-rtdb.europe-west1.firebasedatabase.app";
    const CART_PATH = "/cart.json";

    let cards = [];
    let cart = [];

    const cardsGrid = document.getElementById("cardsGrid");
    const cartList = document.getElementById("cartList");
    const cartItemsEl = document.getElementById("cartItems");
    const cartTotalEl = document.getElementById("cartTotal");
    const statusEl = document.getElementById("status");
    const detailsModal = document.getElementById("detailsModal");
    const detailsTitle = document.getElementById("detailsTitle");
    const detailsBody = document.getElementById("detailsBody");

    document.getElementById("cardForm").addEventListener("submit", onSubmitCard);
    document.getElementById("clearCartBtn").addEventListener("click", clearCart);
    document.getElementById("closeDetailsBtn").addEventListener("click", closeDetails);
    detailsModal.addEventListener("click", (e) => {
      if (e.target === detailsModal) closeDetails();
    });

    init();

    function init() {
      fetchCards();
      fetchCart();
      // refresh automatico ogni 8 secondi (simile realtime)
      setInterval(() => {
        fetchCards();
        fetchCart();
      }, 8000);
    }

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.style.color = isError ? "#fca5a5" : "#cbd5e1";
    }

    async function fetchCart() {
      try {
        const data = await firebaseRequest(`${CART_PATH}?t=${Date.now()}`, { cache: "no-store" });

        if (!data) {
          cart = [];
          renderCart();
          return;
        }

        cart = Object.values(data)
          .map(item => ({
            id: item.id,
            name: item.name,
            price: Number(item.price) || 0,
            qty: Math.max(1, Number(item.qty) || 1)
          }))
          .filter(item => item.id && item.name);

        renderCart();
      } catch (err) {
        console.error("Errore caricamento carrello Firebase:", err);
      }
    }

    async function saveCartToFirebase() {
      const payload = {};
      for (const item of cart) {
        payload[item.id] = {
          id: item.id,
          name: item.name,
          price: Number(item.price) || 0,
          qty: Math.max(1, Number(item.qty) || 1)
        };
      }

      await firebaseRequest(CART_PATH, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
    }

    async function firebaseRequest(path, options = {}) {
      const url = `${FIREBASE_DB_URL}${path}`;
      const response = await fetch(url, options);

      if (!response.ok) {
        const body = await response.text();
        throw new Error(`HTTP ${response.status} ${response.statusText} - ${body || "nessun dettaglio"}`);
      }

      if (response.status === 204) return null;
      return response.json();
    }

    async function fetchCards() {
      setStatus("Carico carte da Firebase...");

      try {
        const data = await firebaseRequest(`/cards.json?t=${Date.now()}`, { cache: "no-store" });

        cards = data
          ? Object.entries(data).map(([id, value]) => ({
              id,
              name: value.name || "Senza nome",
              number: value.number || "000",
              price: Number(value.price) || 0
            }))
          : [];

        cards.sort((a, b) => Number(a.number) - Number(b.number));
        renderCards();
        setStatus(`Carte caricate: ${cards.length}`);
      } catch (err) {
        console.error(err);
        setStatus(`Errore Firebase: ${err.message}`, true);
      }
    }

    async function onSubmitCard(event) {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const number = document.getElementById("number").value.trim();
      const price = Number(document.getElementById("price").value);

      if (!name || !number || !Number.isFinite(price) || price < 0) {
        setStatus("Inserisci dati validi per la carta.", true);
        return;
      }

      setStatus("Salvataggio carta su Firebase...");

      try {
        await firebaseRequest(`/cards.json`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, number, price })
        });

        event.target.reset();
        await fetchCards();
        setStatus("Carta aggiunta con successo.");
      } catch (err) {
        console.error(err);
        setStatus(`Salvataggio fallito: ${err.message}`, true);
      }
    }

    async function deleteCard(cardId) {
      const ok = confirm("Eliminare questa carta?");
      if (!ok) return;

      setStatus("Eliminazione carta...");

      try {
        await firebaseRequest(`/cards/${cardId}.json`, { method: "DELETE" });

        // rimuove anche dal carrello eventuali riferimenti
        cart = cart.filter(item => item.id !== cardId);
        await saveCartToFirebase();
        renderCart();

        await fetchCards();
        setStatus("Carta eliminata.");
      } catch (err) {
        console.error(err);
        setStatus(`Eliminazione fallita: ${err.message}`, true);
      }
    }

    function getCardImage(number) {
      return `https://dz3we2x72f7ol.cloudfront.net/expansions/paradox-rift/it-it/SV04_IT_${number}-2x.png`;
    }

    async function fetchCardmarketData(card) {
      // Usiamo PokéTCG API che espone dati Cardmarket e URL prodotto
      const query = encodeURIComponent(`name:\"${card.name}\" number:${card.number}`);
      const url = `https://api.pokemontcg.io/v2/cards?q=${query}`;

      const res = await fetch(url);
      if (!res.ok) throw new Error(`API prezzo non disponibile (${res.status})`);

      const payload = await res.json();
      const list = Array.isArray(payload?.data) ? payload.data : [];
      if (!list.length) throw new Error("Carta non trovata su Cardmarket/PokéTCG API");

      const match = list.find(c =>
        String(c?.name || "").toLowerCase() === String(card.name).toLowerCase() &&
        String(c?.number || "") === String(card.number)
      ) || list[0];

      const cm = match?.cardmarket || {};
      const prices = cm?.prices || {};

      const candidates = [
        { key: "avg30", label: "Media 30 giorni" },
        { key: "trendPrice", label: "Trend price" },
        { key: "averageSellPrice", label: "Prezzo medio vendita" }
      ];

      let currentPrice = null;
      let sourceLabel = "Prezzo corrente";
      for (const c of candidates) {
        const val = Number(prices[c.key]);
        if (Number.isFinite(val) && val > 0) {
          currentPrice = val;
          sourceLabel = c.label;
          break;
        }
      }

      if (!Number.isFinite(currentPrice)) {
        throw new Error("Prezzo Cardmarket non disponibile per questa carta");
      }

      return {
        currentPrice,
        sourceLabel,
        cardmarketUrl: cm?.url || `https://www.cardmarket.com/it/Pokemon/Products/Search?searchString=${encodeURIComponent(card.name)}`
      };
    }

    function renderDelta(savedPrice, marketPrice) {
      const diff = marketPrice - savedPrice;
      const abs = Math.abs(diff).toFixed(2);

      if (diff > 0) {
        return {
          klass: "up",
          icon: "▲",
          text: `+€ ${abs} (Conviene: prezzo attuale più alto del tuo prezzo registrato)`
        };
      }
      if (diff < 0) {
        return {
          klass: "down",
          icon: "▼",
          text: `-€ ${abs} (Non conviene: prezzo attuale più basso del tuo prezzo registrato)`
        };
      }
      return {
        klass: "neutral",
        icon: "■",
        text: "€ 0.00 (Parità)"
      };
    }

    async function openDetails(cardId) {
      const card = cards.find(c => c.id === cardId);
      if (!card) return;

      detailsTitle.textContent = `${card.name} #${card.number}`;
      detailsBody.innerHTML = `
        <div>Prezzo registrato: <strong>€ ${card.price.toFixed(2)}</strong></div>
        <div style="margin-top:8px;">Carico prezzo attuale da Cardmarket...</div>
      `;

      detailsModal.classList.add("open");
      detailsModal.setAttribute("aria-hidden", "false");

      try {
        const market = await fetchCardmarketData(card);
        const delta = renderDelta(card.price, market.currentPrice);

        detailsBody.innerHTML = `
          <div>Prezzo registrato: <strong>€ ${card.price.toFixed(2)}</strong></div>
          <div style="margin-top:8px;">${market.sourceLabel}: <strong>€ ${market.currentPrice.toFixed(2)}</strong></div>
          <div class="delta ${delta.klass}" style="margin-top:10px; font-weight:700;">
            ${delta.icon} ${delta.text}
          </div>
          <div style="margin-top:10px;">
            <a href="${market.cardmarketUrl}" target="_blank" rel="noopener noreferrer" style="color:#7dd3fc;">Apri pagina Cardmarket</a>
          </div>
        `;
      } catch (err) {
        detailsBody.innerHTML = `
          <div>Prezzo registrato: <strong>€ ${card.price.toFixed(2)}</strong></div>
          <div style="margin-top:8px; color:#fca5a5;">${err.message}</div>
        `;
      }
    }

    function closeDetails() {
      detailsModal.classList.remove("open");
      detailsModal.setAttribute("aria-hidden", "true");
    }

    function renderCards() {
      cardsGrid.innerHTML = "";

      if (!cards.length) {
        cardsGrid.innerHTML = "<p>Nessuna carta disponibile.</p>";
        return;
      }

      for (const card of cards) {
        const article = document.createElement("article");
        article.className = "card";

        article.innerHTML = `
          <img src="${getCardImage(card.number)}" alt="${card.name}" loading="lazy">
          <div class="card-title">${card.name}</div>
          <div class="card-sub">#${card.number}</div>
          <div class="card-sub">€ ${card.price.toFixed(2)}</div>
          <div class="card-actions">
            <button class="btn-success" data-action="add" data-id="${card.id}">+ Carrello</button>
            <button class="btn-danger" data-action="delete" data-id="${card.id}">Elimina</button>
          </div>
          <div class="card-actions" style="margin-top:6px; grid-template-columns:1fr;">
            <button class="btn-info" data-action="details" data-id="${card.id}">Dettagli prezzo</button>
          </div>
        `;

        cardsGrid.appendChild(article);
      }

      cardsGrid.querySelectorAll("button[data-action='add']").forEach(btn => {
        btn.addEventListener("click", () => addToCart(btn.dataset.id));
      });

      cardsGrid.querySelectorAll("button[data-action='delete']").forEach(btn => {
        btn.addEventListener("click", () => deleteCard(btn.dataset.id));
      });

      cardsGrid.querySelectorAll("button[data-action='details']").forEach(btn => {
        btn.addEventListener("click", () => openDetails(btn.dataset.id));
      });
    }

    function addToCart(cardId) {
      const card = cards.find(c => c.id === cardId);
      if (!card) return;

      const existing = cart.find(item => item.id === card.id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({
          id: card.id,
          name: card.name,
          price: card.price,
          qty: 1
        });
      }

      saveCartToFirebase().catch(err => {
        console.error(err);
        setStatus(`Errore salvataggio carrello: ${err.message}`, true);
      });
      renderCart();
    }

    function changeQty(cardId, delta) {
      const item = cart.find(c => c.id === cardId);
      if (!item) return;

      item.qty += delta;
      if (item.qty <= 0) {
        cart = cart.filter(c => c.id !== cardId);
      }

      saveCartToFirebase().catch(err => {
        console.error(err);
        setStatus(`Errore salvataggio carrello: ${err.message}`, true);
      });
      renderCart();
    }

    function clearCart() {
      if (!cart.length) return;
      if (!confirm("Svuotare tutto il carrello?")) return;

      cart = [];
      saveCartToFirebase().catch(err => {
        console.error(err);
        setStatus(`Errore salvataggio carrello: ${err.message}`, true);
      });
      renderCart();
    }

    function renderCart() {
      cartList.innerHTML = "";

      let itemsCount = 0;
      let total = 0;

      if (!cart.length) {
        cartList.innerHTML = "<p>Carrello vuoto.</p>";
      } else {
        for (const item of cart) {
          const subtotal = item.price * item.qty;
          itemsCount += item.qty;
          total += subtotal;

          const div = document.createElement("div");
          div.className = "cart-item";
          div.innerHTML = `
            <div class="cart-row">
              <strong>${item.name}</strong>
              <span>€ ${subtotal.toFixed(2)}</span>
            </div>
            <div class="cart-row" style="margin-top:4px; opacity:.9;">
              <span>€ ${item.price.toFixed(2)} x ${item.qty}</span>
            </div>
            <div class="qty-actions">
              <button class="btn-warning" data-qty="-1" data-id="${item.id}">-1</button>
              <button class="btn-success" data-qty="1" data-id="${item.id}">+1</button>
              <button class="btn-danger" data-qty="remove" data-id="${item.id}">Rimuovi</button>
            </div>
          `;
          cartList.appendChild(div);
        }

        cartList.querySelectorAll("button[data-qty]").forEach(btn => {
          btn.addEventListener("click", () => {
            const id = btn.dataset.id;
            const action = btn.dataset.qty;
            if (action === "remove") {
              cart = cart.filter(c => c.id !== id);
              saveCartToFirebase().catch(err => {
                console.error(err);
                setStatus(`Errore salvataggio carrello: ${err.message}`, true);
              });
              renderCart();
              return;
            }

            changeQty(id, Number(action));
          });
        });
      }

      cartItemsEl.textContent = String(itemsCount);
      cartTotalEl.textContent = total.toFixed(2);
    }
  </script>
</body>
</html>
