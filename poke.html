<script>
let cards = JSON.parse(localStorage.getItem("cards")) || [];

/* CARICA DATI ALL'AVVIO */
window.onload = () => {
  loadCards();

  const savedCols = localStorage.getItem("columns");
  if (savedCols) {
    document.getElementById("columns").value = savedCols;
    changeColumns();
  }
};

/* CAMBIO COLONNE + SALVATAGGIO */
function changeColumns() {
  const cols = document.getElementById('columns').value;
  document.getElementById('grid').style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

  localStorage.setItem("columns", cols);
}

/* AGGIUNTA CARD */
function addCard() {
  const name = document.getElementById('name').value;
  const number = document.getElementById('number').value;
  const set = document.getElementById('set').value;
  const price = document.getElementById('price').value;

  if (!name || !number) return;

  const newCard = { name, number, set, price };
  cards.push(newCard);

  saveCards();
  renderCard(newCard);

  // reset input
  document.getElementById('name').value = '';
  document.getElementById('number').value = '';
  document.getElementById('set').value = '';
  document.getElementById('price').value = '';
}

/* RENDER SINGOLA CARD */
function renderCard(data) {
  const imgUrl = `https://dz3we2x72f7ol.cloudfront.net/expansions/paradox-rift/it-it/SV04_IT_${data.number}-2x.png`;

  const card = document.createElement('div');
  card.className = 'card';

  card.innerHTML = `
    <img src="${imgUrl}">
    <h3>${data.name}</h3>
    <p>#${data.number}</p>
    <p>${data.set}</p>
    <p>€ ${data.price}</p>
  `;

  document.getElementById('grid').appendChild(card);
}

/* CARICA TUTTE LE CARD */
function loadCards() {
  document.getElementById('grid').innerHTML = "";
  cards.forEach(renderCard);
}

/* SALVA IN LOCALSTORAGE */
function saveCards() {
  localStorage.setItem("cards", JSON.stringify(cards));
}
</script>
