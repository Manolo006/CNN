<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Mobile</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
}

/* PANEL */
.panel {
  position: sticky;
  top: 0;
  background: #1e293b;
  padding: 12px;
  border-left: 3px solid #3b82f6;
  border-right: 3px solid #3b82f6;
  z-index: 10;
}

.panel input, .panel select {
  width: 100%;
  margin-bottom: 6px;
  padding: 10px;
  border-radius: 8px;
  border: none;
  font-size: 14px;
}

.panel button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: #3b82f6;
  color: white;
  font-weight: bold;
}

/* GRID */
.container {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 10px;
}

/* CARD */
.card {
  background: #1e293b;
  border-radius: 12px;
  padding: 8px;
  text-align: center;
}

.card img {
  width: 100%;
  border-radius: 8px;
  aspect-ratio: 3/4;
  object-fit: cover;
  cursor: pointer;
}

.card h3 {
  font-size: 13px;
  margin: 6px 0 2px;
}

.card p {
  font-size: 11px;
  margin: 1px 0;
  opacity: 0.8;
}

/* DELETE */
.delete-btn {
  margin-top: 6px;
  width: 100%;
  padding: 6px;
  border: none;
  border-radius: 6px;
  background: #ef4444;
  color: white;
  font-size: 12px;
}

/* FULLSCREEN IMAGE */
.viewer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
}

.viewer img {
  max-width: 95%;
  max-height: 95%;
  border-radius: 10px;
}
</style>
</head>

<body>

<!-- PANEL -->
<div class="panel">
  <select id="columns" onchange="changeColumns()">
    <option value="1">1 colonna</option>
    <option value="2" selected>2 colonne</option>
    <option value="3">3 colonne</option>
    <option value="4">4 colonne</option>
  </select>

  <input type="text" id="name" placeholder="Nome Pokémon">
  <input type="number" id="number" placeholder="Numero">
  <input type="text" id="price" placeholder="Prezzo">

  <button onclick="addCard()">Aggiungi</button>
</div>

<!-- GRID -->
<div class="container" id="grid"></div>

<!-- VIEWER -->
<div class="viewer" id="viewer" onclick="closeViewer()">
  <img id="viewerImg">
</div>

<script>
let cards = JSON.parse(localStorage.getItem("cards")) || [];

/* LOAD */
window.onload = () => {
  loadCards();

  const savedCols = localStorage.getItem("columns");
  if (savedCols) {
    document.getElementById("columns").value = savedCols;
    changeColumns();
  }
};

/* COLONNE */
function changeColumns() {
  const cols = document.getElementById('columns').value;
  document.getElementById('grid').style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  localStorage.setItem("columns", cols);
}

/* ADD */
function addCard() {
  const name = document.getElementById('name').value;
  const number = document.getElementById('number').value;
  const price = document.getElementById('price').value;

  if (!name || !number) return;

  cards.push({ name, number, price });
  saveCards();
  loadCards();

  document.getElementById('name').value = '';
  document.getElementById('number').value = '';
  document.getElementById('price').value = '';
}

/* RENDER */
function renderCard(data, index) {
  const imgUrl = `https://dz3we2x72f7ol.cloudfront.net/expansions/paradox-rift/it-it/SV04_IT_${data.number}-2x.png`;

  const card = document.createElement('div');
  card.className = 'card';

  card.innerHTML = `
    <img src="${imgUrl}" loading="lazy" onclick="openViewer('${imgUrl}')">
    <h3>${data.name}</h3>
    <p>#${data.number}</p>
    <p>€ ${data.price}</p>
    <button class="delete-btn" onclick="deleteCard(${index})">🗑️</button>
  `;

  document.getElementById('grid').appendChild(card);
}

/* LOAD ALL */
function loadCards() {
  document.getElementById('grid').innerHTML = "";
  cards.forEach((c, i) => renderCard(c, i));
}

/* DELETE */
function deleteCard(index) {
  if (!confirm("Vuoi eliminare questa carta?")) return;

  cards.splice(index, 1);
  saveCards();
  loadCards();
}

/* SAVE */
function saveCards() {
  localStorage.setItem("cards", JSON.stringify(cards));
}

/* VIEWER */
function openViewer(src) {
  document.getElementById("viewer").style.display = "flex";
  document.getElementById("viewerImg").src = src;
}

function closeViewer() {
  document.getElementById("viewer").style.display = "none";
}
</script>

</body>
</html>
