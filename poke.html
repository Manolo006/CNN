<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventario Carte Pokémon</title>
    <link rel="stylesheet" href="pokestyle.css" />
  </head>
  <body>
    <main class="container">
      <h1>Inventario Carte Pokémon</h1>
      <p id="progress">Completamento: 0%</p>
      <div id="cards"></div>
      <button id="scanButton">
        <img src="camera-icon.png" alt="Scan" />
      </button>
    </main>

    <script>
      const cards = []; // Questo array verrà popolato con i dati estratti dal CSV

      function aggiornaProgress() {
        const totali = cards.length;
        const possedute = cards.filter(c => c.quantita > 0).length;
        const percentuale = ((possedute / totali) * 100).toFixed(2);
        document.getElementById("progress").innerText = `Completamento: ${percentuale}%`;
      }

      function aggiornaQuantita(index, delta) {
        cards[index].quantita += delta;
        if (cards[index].quantita < 0) cards[index].quantita = 0;
        localStorage.setItem("carte", JSON.stringify(cards));
        render();
      }

      function render() {
        const container = document.getElementById("cards");
        container.innerHTML = "";
        cards.forEach((card, i) => {
          const div = document.createElement("div");
          div.className = "card";
          div.innerHTML = `
            <img src="${card.immagine}" alt="${card.nome}" />
            <div class="info">
              <strong>#${card.numero} ${card.nome}</strong><br />
              Prezzo: ${card.prezzo}<br />
              Quantità: ${card.quantita}
            </div>
            <div class="actions">
              <button onclick="aggiornaQuantita(${i}, -1)\">-1</button>
              <button onclick="aggiornaQuantita(${i}, 1)\">+1</button>
            </div>
          `;
          container.appendChild(div);
        });
        aggiornaProgress();
      }

      window.onload = () => {
        const salvate = localStorage.getItem("carte");
        if (salvate) {
          const parsed = JSON.parse(salvate);
          parsed.forEach(c => cards.push(c));
          render();
        } else {
          // Qui verranno inseriti i dati statici in formato JS
          // Esempio:
          // cards.push({ numero: "001\", nome: \"Bulbasaur\", immagine: \"url\", prezzo: \"0.12\", quantita: 1 });
          render();
        }
      };
    </script>
  </body>
</html>
