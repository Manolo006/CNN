<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carte Pokémon - Paradosso Temporale</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss/dist/tailwind.min.css">
  <style>
    .card-container {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      background: white;
      transition: transform 0.2s;
    }
    .card-container:hover {
      transform: translateY(-4px);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .card-container img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      margin-bottom: 8px;
    }
    .card-actions button {
      padding: 4px 8px;
      margin: 4px;
      border-radius: 4px;
      cursor: pointer;
    }
    .aggiungi {
      background-color: #4CAF50;
      color: white;
    }
    .rimuovi {
      background-color: #f44336;
      color: white;
    }
    #card-preview {
      position: fixed;
      top: 20px;
      right: 20px;
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      z-index: 100;
      max-width: 200px;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-900">
  <div class="max-w-7xl mx-auto p-4">
    <h1 class="text-3xl font-bold mb-6">Carte Pokémon - Paradosso Temporale</h1>

    <div class="mb-4">
      <label class="mr-2 font-medium">Cerca o scansiona il codice della carta:</label>
      <input type="text" id="filtro" class="border p-2 rounded w-full" placeholder="Es. Surskit, 1234 o codice della carta" />
    </div>
    
    <div id="card-preview" style="display:none;">
      <img id="preview-img" src="" alt="" class="w-full h-32 object-contain mb-2" />
      <h3 id="preview-name" class="font-bold"></h3>
      <p id="preview-number" class="text-sm"></p>
      <p id="preview-rarity" class="text-sm text-gray-600"></p>
      <p id="preview-quantity" class="text-sm"></p>
    </div>
    
    <div class="mb-4">
      <label class="font-medium">Completamento collezione:</label>
      <div class="w-full bg-gray-300 rounded-full h-2 mb-2">
        <div id="completion-bar" class="bg-green-500 h-2 rounded-full" style="width: 0%;"></div>
      </div>
      <p id="completion-text" class="text-sm text-gray-600">0% completato</p>
    </div>

    <div class="mb-4 flex gap-4">
      <p id="total-value" class="text-lg font-semibold">Valore collezione: €0.00</p>
      <p id="total-spent" class="text-lg font-semibold">Totale speso: €0.00</p>
    </div>

    <div id="carte" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>

    <div id="modal" style="display:none;" class="fixed inset-0 bg-gray-800 bg-opacity-50 flex justify-center items-center z-50">
      <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-md">
        <h2 class="text-xl font-semibold mb-4">Modifica Carta</h2>
        <img id="modal-img" src="" alt="Carta" class="w-32 mx-auto mb-4" />
        <div class="space-y-3">
          <div>
            <label class="block mb-1">Nome:</label>
            <input type="text" id="modal-nome" class="border p-2 w-full rounded" />
          </div>
          <div>
            <label class="block mb-1">Numero:</label>
            <input type="text" id="modal-numero" class="border p-2 w-full rounded" />
          </div>
          <div>
            <label class="block mb-1">Rarità:</label>
            <input type="text" id="modal-rarita" class="border p-2 w-full rounded" />
          </div>
          <div>
            <label class="block mb-1">Quantità:</label>
            <input type="number" id="modal-quantita" class="border p-2 w-full rounded" min="0" />
          </div>
        </div>
        <div class="flex justify-end gap-2 mt-4">
          <button onclick="chiudiModal()" class="bg-gray-500 text-white px-4 py-2 rounded">Chiudi</button>
          <button onclick="salvaModifiche()" class="bg-blue-500 text-white px-4 py-2 rounded">Salva</button>
        </div>
      </div>
    </div>
  </div>

  <script src="scan.js"></script>
</body>
</html>
