<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conto alla rovescia</title>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f0f0f0;
      font-family: Arial, sans-serif;
      flex-direction: column;
      padding: 10px;
    }
    .countdown {
      background: #fff;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
      overflow-x: auto;
      max-width: 100%;
      margin-bottom: 20px;
    }
    .timer-container {
      display: grid;
      grid-template-columns: repeat(7, minmax(30px, 1fr));
      gap: 2px;
      margin-top: 10px;
    }
    .day-box {
      padding: 5px;
      font-size: 0.8em;
      border-radius: 3px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 30px;
    }
    .day-number {
      font-size: 1em;
      font-weight: bold;
    }
    .day-info {
      font-size: 0.5em;
      color: #f0f0f0;
    }
    .future-day {
      background: #007bff;
      color: white;
    }
    .past-day {
      background: #ccc;
      color: #666;
    }
    .special-day {
      background: #ff5733;
      color: white;
    }
    .live-countdown {
      font-size: 1.2em;
      font-weight: bold;
      color: #333;
      margin-top: 10px;
    }
    .school-days-remaining {
      font-size: 1em;
      color: #007bff;
      font-weight: bold;
      margin-bottom: 5px;
    }
  </style>
</head>
<body>
  <div class="countdown">
    <h1>Conto alla rovescia</h1>
    <div class="school-days-remaining" id="school-days">Giorni di scuola rimanenti: 0</div>
    <div class="live-countdown" id="live-timer">00:00:00:00</div>
    <div class="timer-container" id="days-container"></div>
  </div>
  
  <script>
    function updateCountdown() {
      const now = new Date().getTime();
      const targetDate = new Date("June 18, 2025 08:30:00").getTime();
      const startDate = new Date(targetDate - 100 * 24 * 60 * 60 * 1000);
      const distance = targetDate - now;
      
      if (distance < 0) {
        document.querySelector(".countdown").innerHTML = "Il conto alla rovescia è terminato!";
        return;
      }
      
      const daysRemaining = Math.floor(distance / (1000 * 60 * 60 * 24));
      const daysContainer = document.getElementById("days-container");
      daysContainer.innerHTML = "";
      
      const specialDays = [
        "2025-04-14", "2025-04-15", "2025-04-16", "2025-04-17", "2025-04-18",
        "2025-04-19", "2025-04-20", "2025-04-21", "2025-04-22", "2025-04-23",
        "2025-04-24", "2025-04-25", "2025-05-01", "2025-06-02", "2025-06-06",
        "2025-06-09", "2025-06-10", "2025-06-11", "2025-06-12", "2025-06-13",
        "2025-06-16"
      ];
      
      const weekdays = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];
      let schoolDaysRemaining = 0;
      
      for (let i = 0; i < 100; i++) {
        const dayBox = document.createElement("div");
        dayBox.className = "day-box";

        const currentDate = new Date(startDate.getTime() + i * 24 * 60 * 60 * 1000);
        const formattedDate = currentDate.toISOString().split('T')[0];
        const dayOfWeek = weekdays[currentDate.getDay()];
        const dayMonth = currentDate.toLocaleDateString('it-IT', { day: 'numeric', month: 'long' });

        const isPast = i < 100 - daysRemaining;
        const isWeekendOrSpecial = specialDays.includes(formattedDate) || currentDate.getDay() === 0 || currentDate.getDay() === 6;

        if (isPast) {
          dayBox.classList.add("past-day");
        } else if (isWeekendOrSpecial) {
          dayBox.classList.add("special-day");
        } else {
          dayBox.classList.add("future-day");
          schoolDaysRemaining++;
        }

        dayBox.innerHTML = `<div class='day-number'>${100 - i}</div><div class='day-info'>${dayOfWeek}<br>${dayMonth}</div>`;
        daysContainer.appendChild(dayBox);
      }

      document.getElementById("school-days").innerText = `Giorni di scuola rimanenti: ${schoolDaysRemaining}`;

      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);
      document.getElementById("live-timer").innerText = `${daysRemaining}d ${hours}h ${minutes}m ${seconds}s`;
    }

    updateCountdown(); 
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
